<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yu Stellar Games Studio</title>
  <desc id="desc">Small games. Infinite worlds. A mint and lavender orbital star over a midnight-blue starfield.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#091322"/>
      <stop offset="0.6" stop-color="#11172f"/>
      <stop offset="1" stop-color="#272044"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#9d8aff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9d8aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x2="1" y2="1">
      <stop stop-color="#b5ffe9"/>
      <stop offset="0.5" stop-color="#8de8df"/>
      <stop offset="1" stop-color="#ba9eff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a6b9df" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#sky)"/>
